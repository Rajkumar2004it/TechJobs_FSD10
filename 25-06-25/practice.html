<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="my1"></h1>
    <script>
        function hello(){
            var d= new Date();
            document.getElementById("my1").innerHTML=d.toLocaleTimeString();

        }
        hello();
        setInterval(hello,1000);
    </script>
</body>
</html>
