<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="myh1" onmousedown="hello1()" onmouseup="hello2()">Tech jobs</h1>
    <p id="myp"  onmouseover="hello3()" onmouseout="hello4()">Lorem ipsum dolor sit.</p>
<script>
    function hello1(){
        document.getElementById("myh1").style.color="green";
    }
       function hello2(){
        document.getElementById("myh1").style.color="yellow";
    }
      function hello3(){
        document.getElementById("myp").style.color="blue";
    }
      function hello4(){
        document.getElementById("myp").style.color="red";
    }
</script>




</body>
</html>
