<head>

    <div class="container-fluid">
        <div class="row">

            <div class="col-md-12">
                <div class="carousel slide" id="mycar" data-bs-ride="carousel" data-bs-interval="3000">
                    <ul class="carousel-indicators">
                        <li class="active" data-bs-target="#mycar" data-bs-slide-to="0"></li>
                        <li data-bs-target="#mycar" data-bs-slide-to="1"></li>
                        <li data-bs-target="#mycar" data-bs-slide-to="2"></li>
                    </ul>

                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="https://builderz-interior.web.app/int-img2.png" alt="" class="d-block w-100">
                            <div class="carousel-caption d-none d-md-block">
                                <h3>first image</h3>

                        </div>

                        <div class="carousel-item">

                    </div>
                    <button class="carousel-control-prev" data-bs-target="#mycar" data-bs-slide="prev">

        <div class="row">
            <ul class="pagination">

                        <h2 class="accordion-header">
                            <button class="accordion-button" data-bs-target="#accone" data-bs-toggle="collapse">Full
                                stack</button>
                        </h2>
                        <div class="collapse accordion-collapse" id="accone" data-bs-parent="#myacc">
                            <h6>content</h6>
                            <ul>
                                <li>Angular</li>
                                <li>node</li>
                                <li>express</li>

                        <button class="btn-close" data-bs-dismiss="modal"> </button>
                    </div>
                    <div class="modal-body">
                        <div class="row d-flex justify-content-center ">
                            <div class="col-md-5">
                                <div class="form-group">
                                    <label for="" class="form-label">username</label>
                                    <input type="text" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label for="form-label">password</label>
                                    <input type="password" class="form-control">
                                </div>
                                <button class="btn btn-success">submit</button>
                                <button class="btn btn-danger" data-bs-dismiss="modal">exit</button>
